name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # The MCP smoke test must run in CI, not skip.
      REQUIRE_MCP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Tests (demos 1-3 on the sample, demo 4 smoke test)
        run: uv run pytest -q
      - name: Demo 3 at full size on DuckDB 2.0 (numbers for the deck, printed below)
        run: uv run python demo/run_03_parquet.py
      - name: The deck builds from the reports
        run: uv run --group docs python docs/make_deck.py
